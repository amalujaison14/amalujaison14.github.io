<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Confirmed | NOVA UAE</title>
<meta name="description" content="Your NOVA UAE order has been confirmed.">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-TQCW2LDC"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->
<header>
  <a class="logo" href="index.html">NOVA UAE</a>
  <nav><a href="index.html">Home</a></nav>
</header>

<section style="text-align:center;padding:80px 20px;">
  <div style="font-size:50px;">✅</div>
  <h1 style="font-size:28px;color:var(--navy);">Order Confirmed!</h1>
  <p style="color:var(--muted);" id="order-detail"></p>
  <div style="max-width:400px;margin:30px auto;background:var(--bg-light);padding:24px;border-radius:6px;text-align:left;" id="order-box"></div>
  <a href="index.html" class="btn">Continue Shopping</a>
</section>

<footer><div class="footer-bottom">&copy; 2026 NOVA UAE</div></footer>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const order = JSON.parse(localStorage.getItem("nova_last_order") || "null");
  if (!order) {
    document.getElementById("order-detail").textContent = "No recent order found.";
    return;
  }
  document.getElementById("order-detail").textContent = `Thank you, ${order.name}! Your order ${order.orderId} has been placed.`;
  document.getElementById("order-box").innerHTML = `
    <p><strong>Order ID:</strong> ${order.orderId}</p>
    <p><strong>Delivery Address:</strong> ${order.address}</p>
    <p><strong>Payment Method:</strong> ${order.payment}</p>
    <p><strong>Total:</strong> AED ${order.total}</p>
    <p style="color:var(--muted);font-size:13px;">Estimated delivery: 1-3 business days</p>
  `;
});
</script>
</body>
</html>
