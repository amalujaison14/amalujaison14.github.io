<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Cart | NOVA UAE</title>
<meta name="description" content="Review items in your NOVA UAE shopping cart before checkout.">
<link rel="stylesheet" href="style.css">
<style>
.cart-row { display:flex; align-items:center; gap:20px; padding:16px 0; border-bottom:1px solid #eee; }
.cart-row img { width:80px; height:90px; object-fit:cover; border-radius:4px; }
.cart-row .info { flex:1; }
.qty-control { display:flex; align-items:center; gap:8px; }
.qty-control button { width:28px; height:28px; border:1px solid #ccc; background:#fff; cursor:pointer; border-radius:4px; }
.cart-summary { max-width:400px; margin:30px auto 0; padding:20px; background:var(--bg-light); border-radius:6px; }
.cart-summary .row { display:flex; justify-content:space-between; padding:6px 0; }
.cart-summary .total { font-weight:700; font-size:18px; border-top:1px solid #ddd; padding-top:10px; margin-top:6px; }
</style>
</head>
<body>
<header>
  <a class="logo" href="index.html">NOVA UAE</a>
  <nav>
    <a href="category-womens.html">Women</a>
    <a href="category-mens.html">Men</a>
    <a href="category-accessories.html">Accessories</a>
    <a href="blog-summer-dresses.html">Style Guide</a>
    <a href="about.html">About</a>
    <a href="cart.html">Cart (<span id="cart-badge">0</span>)</a>
  </nav>
</header>

<div class="breadcrumb"><a href="index.html">Home</a> / Cart</div>

<section style="padding-top:10px;">
  <h1 style="font-size:28px;">Your Cart</h1>
  <div id="cart-items"></div>
  <div id="cart-empty" style="display:none;text-align:center;padding:40px;color:var(--muted);">
    Your cart is empty. <a href="category-womens.html" style="color:var(--accent);">Continue shopping</a>
  </div>
  <div class="cart-summary" id="cart-summary" style="display:none;">
    <div class="row"><span>Subtotal</span><span id="sub-total"></span></div>
    <div class="row"><span>Delivery</span><span>Free</span></div>
    <div class="row total"><span>Total</span><span id="grand-total"></span></div>
    <a href="checkout.html" class="btn" style="display:block;text-align:center;margin-top:16px;">Proceed to Checkout</a>
  </div>
</section>

<footer><div class="footer-bottom">&copy; 2026 NOVA UAE — Online Fashion Store Dubai</div></footer>

<script src="cart.js"></script>
<script>
function renderCartPage() {
  const cart = getCart();
  const container = document.getElementById("cart-items");
  const empty = document.getElementById("cart-empty");
  const summary = document.getElementById("cart-summary");
  container.innerHTML = "";

  const ids = Object.keys(cart);
  if (ids.length === 0) {
    empty.style.display = "block";
    summary.style.display = "none";
    return;
  }
  empty.style.display = "none";
  summary.style.display = "block";

  ids.forEach(id => {
    const p = PRODUCTS[id];
    if (!p) return;
    const qty = cart[id];
    const row = document.createElement("div");
    row.className = "cart-row";
    row.innerHTML = `
      <img src="${p.image}" alt="${p.name}">
      <div class="info">
        <h3 style="margin:0 0 6px;">${p.name}</h3>
        <p style="color:var(--accent);font-weight:700;margin:0;">AED ${p.price}</p>
      </div>
      <div class="qty-control">
        <button onclick="updateQty('${id}', ${qty-1})">-</button>
        <span>${qty}</span>
        <button onclick="updateQty('${id}', ${qty+1})">+</button>
      </div>
      <button onclick="removeFromCart('${id}')" style="background:none;border:none;color:#c0392b;cursor:pointer;">Remove</button>
    `;
    container.appendChild(row);
  });

  const { total } = getCartTotal();
  document.getElementById("sub-total").textContent = `AED ${total}`;
  document.getElementById("grand-total").textContent = `AED ${total}`;
}
document.addEventListener("DOMContentLoaded", renderCartPage);
</script>
</body>
</html>
